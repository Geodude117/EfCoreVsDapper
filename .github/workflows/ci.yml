name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EfCoreVsDapper.slnx

      - name: Build
        run: dotnet build EfCoreVsDapper.slnx --no-restore --configuration Release

      # The tests start SQL Server in Docker with Testcontainers; GitHub's Ubuntu runners have Docker.
      - name: Test
        run: dotnet test EfCoreVsDapper.slnx --no-build --configuration Release --logger "console;verbosity=normal"
